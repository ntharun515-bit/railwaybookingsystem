<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Railway Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="auth-card text-center">
                        <h2 class="mb-4">Welcome Back</h2>
                        <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>
                        <form id="login-form">
                            <div class="mb-3 text-start">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-4 text-start">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3" id="login-btn">Login</button>
                            <p class="text-muted">Don't have an account? <a href="/register.html">Register here</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const alert = document.getElementById('login-alert');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Logging in...';
            btn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (!response.ok) throw new Error('Invalid credentials');
                
                const data = await response.json();
                setToken(data.accessToken, { id: data.id, username: data.username, email: data.email, roles: data.roles });
                
                window.location.href = '/dashboard.html';
            } catch (err) {
                alert.textContent = err.message;
                alert.classList.remove('d-none');
                btn.innerHTML = 'Login';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
