<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Ticket - RailConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/index.html"><i class="fas fa-train me-2"></i>RailConnect</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/search-trains.html">Search Trains</a></li>
                </ul>
                <ul class="navbar-nav ms-auto" id="nav-auth"></ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <!-- Not logged in alert -->
        <div id="login-alert" class="alert alert-warning d-none">
            <i class="fas fa-exclamation-triangle me-2"></i>You must be logged in to book tickets. 
            <a href="/login.html" class="alert-link">Login here</a> or <a href="/register.html" class="alert-link">Register</a>.
        </div>

        <div class="row" id="booking-content">
            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white">
                        <h4 class="mb-0"><i class="fas fa-train me-2 text-primary"></i>Train Details</h4>
                    </div>
                    <div class="card-body" id="train-details-container">
                        <div class="text-center py-4">
                            <span class="spinner-border text-primary"></span>
                            <p class="mt-2 text-muted">Loading train details...</p>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0"><i class="fas fa-users me-2 text-primary"></i>Passenger Details</h4>
                        <button class="btn btn-sm btn-outline-primary" onclick="addPassengerRow()"><i class="fas fa-plus me-1"></i>Add Passenger</button>
                    </div>
                    <div class="card-body">
                        <div id="passengers-container"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card shadow-sm sticky-top" style="top: 100px;">
                    <div class="card-header bg-white">
                        <h4 class="mb-0"><i class="fas fa-receipt me-2 text-primary"></i>Fare Summary</h4>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Base Fare per person</span>
                            <span id="base-fare">₹0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Passengers</span>
                            <span id="pax-count">1</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <strong>Total Amount</strong>
                            <strong class="fs-4 text-success" id="total-amount">₹0</strong>
                        </div>
                        
                        <h6 class="mb-3"><i class="fas fa-credit-card me-2"></i>Payment Method</h6>
                        <select class="form-select mb-4" id="payment-method">
                            <option value="UPI">UPI</option>
                            <option value="CREDIT_CARD">Credit Card</option>
                            <option value="DEBIT_CARD">Debit Card</option>
                            <option value="NET_BANKING">Net Banking</option>
                        </select>
                        
                        <button class="btn btn-primary w-100 btn-lg" id="pay-btn" onclick="processBookingAndPayment()">
                            <i class="fas fa-lock me-2"></i>Pay & Book
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let currentTrain = null;
        let passengerCount = 0;
        
        const urlParams = new URLSearchParams(window.location.search);
        const trainId = urlParams.get('trainId');
        const journeyDate = urlParams.get('date');

        document.addEventListener('DOMContentLoaded', async () => {
            const user = getUser();
            if (!user) {
                document.getElementById('login-alert').classList.remove('d-none');
                document.getElementById('booking-content').style.opacity = '0.5';
                document.getElementById('booking-content').style.pointerEvents = 'none';
            }
            
            if (!trainId || !journeyDate) {
                alert('Invalid booking request. Please search for trains first.');
                window.location.href = '/search-trains.html';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/trains/${trainId}`);
                if (!response.ok) throw new Error('Train not found');
                currentTrain = await response.json();
                
                const src = currentTrain.sourceStation;
                const dst = currentTrain.destinationStation;
                
                document.getElementById('train-details-container').innerHTML = `
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5 class="fw-bold text-primary mb-1">${currentTrain.trainName}</h5>
                            <span class="text-muted">#${currentTrain.trainNumber}</span>
                        </div>
                        <span class="badge bg-primary fs-6">${currentTrain.trainType}</span>
                    </div>
                    <p class="mb-2"><i class="fas fa-calendar me-2"></i><strong>Journey Date:</strong> ${journeyDate}</p>
                    <div class="bg-light p-3 rounded mt-3">
                        <div class="row text-center">
                            <div class="col">
                                <h4 class="mb-1">${currentTrain.departureTime ? currentTrain.departureTime.substring(0,5) : '--'}</h4>
                                <strong>${src ? src.stationName : ''}</strong><br>
                                <small class="text-muted">${src ? src.stationCode : ''}</small>
                            </div>
                            <div class="col d-flex align-items-center justify-content-center">
                                <div class="text-center">
                                    <small class="text-muted">${currentTrain.duration || ''}</small><br>
                                    <i class="fas fa-arrow-right text-primary fa-lg"></i>
                                </div>
                            </div>
                            <div class="col">
                                <h4 class="mb-1">${currentTrain.arrivalTime ? currentTrain.arrivalTime.substring(0,5) : '--'}</h4>
                                <strong>${dst ? dst.stationName : ''}</strong><br>
                                <small class="text-muted">${dst ? dst.stationCode : ''}</small>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 d-flex justify-content-between">
                        <span><i class="fas fa-chair me-1"></i>Available: <strong class="text-success">${currentTrain.availableSeats}</strong></span>
                        <span><i class="fas fa-rupee-sign me-1"></i>Fare: <strong class="text-success">₹${currentTrain.ticketFare}</strong> per person</span>
                    </div>
                `;
                
                addPassengerRow();
                updateFare();
                
            } catch (err) {
                document.getElementById('train-details-container').innerHTML = `
                    <div class="alert alert-danger">Failed to load train details. <a href="/search-trains.html">Go back to search</a>.</div>
                `;
            }
        });

        function addPassengerRow() {
            if(passengerCount >= 6) {
                alert('Maximum 6 passengers allowed per booking');
                return;
            }
            
            passengerCount++;
            const idx = passengerCount;
            const div = document.createElement('div');
            div.className = 'row g-3 mb-3 passenger-row p-2 bg-light rounded';
            div.innerHTML = `
                <div class="col-12 mb-1"><strong>Passenger ${idx}</strong></div>
                <div class="col-md-4">
                    <input type="text" class="form-control pax-name" placeholder="Full Name" required>
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control pax-age" placeholder="Age" min="1" max="120" required>
                </div>
                <div class="col-md-2">
                    <select class="form-select pax-gender" required>
                        <option value="">Gender</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                        <option value="O">Other</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select pax-pref">
                        <option value="NONE">No Pref</option>
                        <option value="LB">Lower Berth</option>
                        <option value="MB">Middle Berth</option>
                        <option value="UB">Upper Berth</option>
                        <option value="SLB">Side Lower</option>
                        <option value="SUB">Side Upper</option>
                    </select>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    ${passengerCount > 1 ? `<button type="button" class="btn btn-outline-danger btn-sm" onclick="removePassenger(this)"><i class="fas fa-trash"></i></button>` : ''}
                </div>
            `;
            document.getElementById('passengers-container').appendChild(div);
            updateFare();
        }

        function removePassenger(btn) {
            btn.closest('.passenger-row').remove();
            passengerCount--;
            updateFare();
        }

        function updateFare() {
            if(!currentTrain) return;
            const rows = document.querySelectorAll('.passenger-row').length;
            document.getElementById('pax-count').textContent = rows;
            document.getElementById('base-fare').textContent = '₹' + currentTrain.ticketFare;
            document.getElementById('total-amount').textContent = '₹' + (rows * currentTrain.ticketFare);
        }

        async function processBookingAndPayment() {
            const user = getUser();
            if (!user) {
                alert('Please login first!');
                window.location.href = '/login.html';
                return;
            }

            const btn = document.getElementById('pay-btn');
            const rows = document.querySelectorAll('.passenger-row');
            const passengers = [];
            
            let valid = true;
            rows.forEach(row => {
                const name = row.querySelector('.pax-name').value.trim();
                const age = row.querySelector('.pax-age').value;
                const gender = row.querySelector('.pax-gender').value;
                const pref = row.querySelector('.pax-pref').value;
                
                if(!name || !age || !gender) valid = false;
                passengers.push({ name, age: parseInt(age), gender, seatPreference: pref });
            });
            
            if(!valid || passengers.length === 0) {
                alert('Please fill all required passenger details (Name, Age, Gender)');
                return;
            }
            
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing Payment...';
            btn.disabled = true;
            
            try {
                // 1. Create Booking
                const booking = await fetchAPI('/bookings', {
                    method: 'POST',
                    body: JSON.stringify({
                        trainId: parseInt(trainId),
                        journeyDate: journeyDate,
                        passengers: passengers
                    })
                });
                
                // 2. Process Payment
                const payment = await fetchAPI('/payments', {
                    method: 'POST',
                    body: JSON.stringify({
                        bookingId: booking.id,
                        paymentMethod: document.getElementById('payment-method').value,
                        amount: booking.totalAmount
                    })
                });
                
                if(payment.status === 'SUCCESS') {
                    alert('🎉 Booking Confirmed!\n\nPNR: ' + booking.pnrNumber + '\nBooking ID: ' + booking.bookingId + '\nTotal: ₹' + booking.totalAmount);
                    window.location.href = '/dashboard.html';
                } else {
                    alert('❌ Payment Failed. Please try again.');
                    btn.innerHTML = '<i class="fas fa-lock me-2"></i>Pay & Book';
                    btn.disabled = false;
                }
                
            } catch (err) {
                alert('Error: ' + err.message);
                btn.innerHTML = '<i class="fas fa-lock me-2"></i>Pay & Book';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
