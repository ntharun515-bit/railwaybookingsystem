<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Railway Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="container">
            <div class="row justify-content-center mt-5 mb-5">
                <div class="col-md-6">
                    <div class="auth-card text-center">
                        <h2 class="mb-4">Create Account</h2>
                        <div id="register-alert" class="alert d-none" role="alert"></div>
                        <form id="register-form">
                            <div class="row">
                                <div class="col-md-6 mb-3 text-start">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName" required>
                                </div>
                                <div class="col-md-6 mb-3 text-start">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" required>
                                </div>
                            </div>
                            <div class="mb-3 text-start">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3 text-start">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3 text-start">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" id="phone" required>
                            </div>
                            <div class="mb-4 text-start">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3" id="register-btn">Register</button>
                            <p class="text-muted">Already have an account? <a href="/login.html">Login here</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            const alert = document.getElementById('register-alert');
            
            const userData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value,
                role: ["user"]
            };
            
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Registering...';
            btn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.message || 'Registration failed');
                
                alert.className = 'alert alert-success';
                alert.textContent = 'Registration successful! Redirecting to login...';
                
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } catch (err) {
                alert.className = 'alert alert-danger';
                alert.textContent = err.message;
                btn.innerHTML = 'Register';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
