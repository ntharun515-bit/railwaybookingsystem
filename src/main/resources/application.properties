# Server Config
server.port=${PORT:8080}

# Database Config
spring.datasource.url=${DB_URL:jdbc:h2:mem:railway_booking_db}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:9198}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.h2.console.enabled=true

# Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=true

# JWT Config - Base64 encoded secret (minimum 256 bits for HS256)
railway.app.jwtSecret=UmFpbHdheUJvb2tpbmdBcHBTZWNyZXRLZXlGb3JKd3RBdXRoZW50aWNhdGlvbldoaWNoU2hvdWxkQmVWZXJ5TG9uZ1RvU2VjdXJlVGhlQXBwbGljYXRpb24xMjM0NTY3ODkw
railway.app.jwtExpirationMs=86400000

# Jackson - handle lazy loading properly
spring.jackson.serialization.fail-on-empty-beans=false
